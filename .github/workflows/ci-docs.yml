name: Continuous Integration (Docs)

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
      - name: Installing project dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Build
        run: |
          # Check before the build regenerates declarations and hides stale committed output
          pnpm run jsx-types:check
          pnpm run build
      - name: Setup Playwright
        run: |
          pnpm --filter @wcc/docs exec playwright install --with-deps
      - name: Format
        run: |
          pnpm run format:check
      - name: Lint
        run: |
          pnpm run lint
      - name: Build the website
        run: |
          pnpm run docs:build
      - name: Check Types
        run: |
          pnpm run check:types
      - name: Test Docs
        run: |
          pnpm run test:docs
