name: Continuous Integration

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js for the build
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Installing project dependencies
        run: |
          pnpm ci
      - name: Build
        run: |
          pnpm run build
      - name: Use Node.js ${{ matrix.node }} for tests
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: |
          pnpm run test
